[EXECUTE]
srsue_conf_testcases.control

[ORDERED_INCLUDE]

[LOGGING]
LogFile := "../logs/%c_titan.%s"
FileMask := LOG_ALL | TTCN_MATCHING | TTCN_DEBUG 
ConsoleMask := ERROR | TESTCASE | STATISTICS
LogSourceInfo := Yes
logEntityName := Yes
//FileMask := TTCN_MATCHING | TTCN_DEBUG|ACTION|DEFAULTOP|ERROR|EXECUTOR|FUNCTION|PARALLEL|PORTEVENT|STATISTICS|TESTCASE|TIMEROP|USER|VERDICTOP|WARNING
LogEventTypes := Yes
SourceInfoFormat := Single
AppendFile := Yes

LoggerPlugins := { JUnitLogger := "libjunitlogger2" }
*.JUnitLogger.filename_stem := "../logs/srslte_ue_test"
*.JUnitLogger.testsuite_name := "3GPP UE testsuite"

[TESTPORT_PARAMETERS]
