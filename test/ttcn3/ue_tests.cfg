[MODULE_PARAMETERS]
Parameters.px_AccessPointName          := '746974616e2e7474636e33'O; // titan.ttcn3
Parameters.px_AuthAMF                  := '1001000000000001'B; // 0x9001
Parameters.px_IMSI_Def                 := '001010123456789'H
Parameters.px_IMEI_Def                 := '356092040793011'H

Parameters.px_IPv4_Address             := "127.0.0.99";
Parameters.px_IPv4_Address2            := "127.0.0.100";
Parameters.px_IPv4_RemoteAddress       := "127.0.0.1"; // IP used to bind UDP to 
Parameters.px_IPv6_Address             := "";
Parameters.px_IPv6_Address2            := "";
Parameters.px_IPv6_RemoteAddress       := "";

// Turn off NAS ciphering and integrity and only enable AS integrity (null integrity is not supported)
EUTRA_Parameters.px_NAS_CipheringAlgorithm     := '000'B;
EUTRA_Parameters.px_NAS_IntegrityProtAlgorithm := '010'B; // '010'B for EIA2
EUTRA_Parameters.px_RRC_CipheringAlgorithm     := eea0;
EUTRA_Parameters.px_RRC_IntegrityProtAlgorithm := eia2;

EUTRA_Parameters.px_eUE_Category_Type          := 4;
EUTRA_Parameters.pc_eBand7_Supp                := true; 

#PIXIT Parameters
Parameters.pc_Automatic_Re_Attach              := true; // UE reattaches automatically after receiving detach reqeust
Parameters.pc_Attach                           := true; // Support EPS attach (with or without pre-configuration)
Parameters.pc_FDD                              := false;

