name: E2E ZMQ test
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e2e image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5

    - uses: docker/setup-buildx-action@v4

    - name: Build e2e image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: test/docker/Dockerfile
        target: e2e
        tags: srsran-e2e:ci
        outputs: type=docker,dest=${{ runner.temp }}/srsran-e2e.tar
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build 5G e2e image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: test/docker/Dockerfile
        target: e2e-5g
        tags: srsran-e2e-5g:ci
        outputs: type=docker,dest=${{ runner.temp }}/srsran-e2e-5g.tar
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Upload e2e image
      uses: actions/upload-artifact@v6
      with:
        name: srsran-e2e-image
        path: ${{ runner.temp }}/srsran-e2e.tar
        retention-days: 1

    - name: Upload 5G e2e image
      uses: actions/upload-artifact@v6
      with:
        name: srsran-e2e-5g-image
        path: ${{ runner.temp }}/srsran-e2e-5g.tar
        retention-days: 1

  e2e_zmq:
    name: E2E srsUE+srsENB+srsEPC (${{ matrix.nof_prb }} PRB, ${{ matrix.num_cc }} CC, ${{ matrix.eea }}, ${{ matrix.tm }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        nof_prb: [6, 15, 25, 50, 75, 100]
        num_cc: [1]
        eea: [EEA0]
        tm: [TM1]
        include:
          # each include overrides a matrix value, so it is added as a separate job
          - nof_prb: 50
            num_cc: 1
            eea: EEA2
            tm: TM1
          # carrier aggregation with two cells
          - nof_prb: 50
            num_cc: 2
            eea: EEA0
            tm: TM1
          # transmit diversity and spatial multiplexing with 2 antennas
          - nof_prb: 50
            num_cc: 1
            eea: EEA0
            tm: TM2
          - nof_prb: 50
            num_cc: 1
            eea: EEA0
            tm: TM3
          - nof_prb: 50
            num_cc: 1
            eea: EEA0
            tm: TM4
    steps:
    - name: Download e2e image
      uses: actions/download-artifact@v7
      with:
        name: srsran-e2e-image
        path: ${{ runner.temp }}

    - name: Load e2e image
      run: docker load --input ${{ runner.temp }}/srsran-e2e.tar

    # srsEPC needs SCTP, which a container can't load itself and isn't loaded by default on all runner images
    - name: Load SCTP kernel module
      run: |
        if ! sudo modprobe sctp; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends linux-modules-extra-$(uname -r)
          sudo modprobe sctp
        fi
        lsmod | grep -w sctp

    - name: Run e2e test
      run: |
        mkdir -p e2e_logs
        docker run --rm --privileged -v "$PWD/e2e_logs:/logs" srsran-e2e:ci ${{ matrix.nof_prb }} ${{ matrix.num_cc }} ${{ matrix.eea }} ${{ matrix.tm }}

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: e2e-logs-${{ matrix.nof_prb }}prb-${{ matrix.num_cc }}cc-${{ matrix.eea }}-${{ matrix.tm }}
        path: e2e_logs/

  e2e_zmq_ho:
    name: E2E srsUE+srsENB handover (${{ matrix.mode }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # intra-eNB handover with srsEPC
          - mode: intra
            image: srsran-e2e
          # S1 handover between two eNBs, needs Open5GS as EPC from the 5G image
          - mode: s1
            image: srsran-e2e-5g
    steps:
    - name: Download e2e image
      uses: actions/download-artifact@v7
      with:
        name: ${{ matrix.image }}-image
        path: ${{ runner.temp }}

    - name: Load e2e image
      run: docker load --input ${{ runner.temp }}/${{ matrix.image }}.tar

    - name: Load SCTP kernel module
      run: |
        if ! sudo modprobe sctp; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends linux-modules-extra-$(uname -r)
          sudo modprobe sctp
        fi
        lsmod | grep -w sctp

    - name: Run handover e2e test
      run: |
        mkdir -p e2e_logs
        docker run --rm --privileged -v "$PWD/e2e_logs:/logs" --entrypoint /srsran/test/run_lte_ho.sh ${{ matrix.image }}:ci /srsran/build ${{ matrix.mode }} 25 4

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: e2e-logs-ho-${{ matrix.mode }}
        path: e2e_logs/

  e2e_zmq_5g:
    name: E2E 5G srsUE+srsENB (${{ matrix.mode }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [nsa_fdd, nsa_tdd, sa_fdd]
    steps:
    - name: Download 5G e2e image
      uses: actions/download-artifact@v7
      with:
        name: srsran-e2e-5g-image
        path: ${{ runner.temp }}

    - name: Load 5G e2e image
      run: docker load --input ${{ runner.temp }}/srsran-e2e-5g.tar

    # srsEPC and the 5GC need SCTP, which a container can't load itself and isn't loaded by default on all runner images
    - name: Load SCTP kernel module
      run: |
        if ! sudo modprobe sctp; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends linux-modules-extra-$(uname -r)
          sudo modprobe sctp
        fi
        lsmod | grep -w sctp

    - name: Run 5G e2e test
      run: |
        mkdir -p e2e_logs
        docker run --rm --privileged -v "$PWD/e2e_logs:/logs" srsran-e2e-5g:ci ${{ matrix.mode }}

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: e2e-5g-logs-${{ matrix.mode }}
        path: e2e_logs/
