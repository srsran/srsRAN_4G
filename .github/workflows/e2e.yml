name: E2E ZMQ test
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e2e image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - name: Build e2e image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: test/docker/Dockerfile
        tags: srsran-e2e:ci
        outputs: type=docker,dest=${{ runner.temp }}/srsran-e2e.tar
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Upload e2e image
      uses: actions/upload-artifact@v4
      with:
        name: srsran-e2e-image
        path: ${{ runner.temp }}/srsran-e2e.tar
        retention-days: 1

  e2e_zmq:
    name: E2E srsUE+srsENB+srsEPC (${{ matrix.nof_prb }} PRB, ${{ matrix.num_cc }} CC)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        nof_prb: [6, 15, 25, 50, 75, 100]
        num_cc: [1]
    steps:
    - name: Download e2e image
      uses: actions/download-artifact@v4
      with:
        name: srsran-e2e-image
        path: ${{ runner.temp }}

    - name: Load e2e image
      run: docker load --input ${{ runner.temp }}/srsran-e2e.tar

    - name: Run e2e test
      run: |
        mkdir -p e2e_logs
        docker run --rm --privileged -v "$PWD/e2e_logs:/logs" srsran-e2e:ci ${{ matrix.nof_prb }} ${{ matrix.num_cc }}

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-logs-${{ matrix.nof_prb }}prb-${{ matrix.num_cc }}cc
        path: e2e_logs/
